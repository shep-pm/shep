# Moves the commit pins in .github/workflows weekly, and the lockfiles
# monthly. Subjects carry `ci(deps):` / `chore(deps):` so commits.yml
# accepts them; release-plz skips both, so a bump alone makes no changelog
# entry and release-plz-pr.yml's no-op guard holds that release open.
#
# `cooldown` holds a release back a week before it is proposed, so a broken
# one is usually fixed or yanked first. Security updates skip the wait.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]
    cooldown:
      default-days: 7

  # The cargo groups take minor and patch only. A semver major comes as its
  # own PR, so one breaking crate cannot sink every other bump with it.
  # Dependabot reads 0.29 -> 0.31 as minor, so a 0.x breaking bump still
  # rides in the group.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    cooldown:
      default-days: 7
    # notify 8.2.0 declares fsevent-sys "4.0.0"; the 4.1.0 floor pin is
    # deliberate. Drop this once a notify release declares fsevent-sys 5.
    ignore:
      - dependency-name: fsevent-sys
        update-types: [version-update:semver-major]
      # #1313's toml 1.1.6 bump broke every Rust-compiling test.yml leg at e2c8165.
      # Drop this once shep's planned toml 1.x migration passes those legs.
      - dependency-name: toml
        update-types: [version-update:semver-major]
      # croner 4 breaks shep-core's cron parsing; the ceiling in the root
      # Cargo.toml is deliberate. Drop this once config/cron.rs moves to croner 4.
      - dependency-name: croner
        update-types: [version-update:semver-major]

  # benches/ is its own workspace with its own lockfile, excluded from the
  # root one so a bench-only dependency can never reach a shipped binary,
  # which also means the entry above never sees it.
  - package-ecosystem: cargo
    directory: /benches
    schedule:
      interval: monthly
    groups:
      cargo-benches:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    cooldown:
      default-days: 7
    # notify 8.2.0 declares fsevent-sys "4.0.0"; the 4.1.0 floor pin is
    # deliberate. Drop this once a notify release declares fsevent-sys 5.
    #
    # json5 1.x does not build here (#1311); shep-core is written against the
    # 0.4 line. Drop this once 1.x is adopted deliberately.
    ignore:
      - dependency-name: fsevent-sys
        update-types: [version-update:semver-major]
      - dependency-name: json5
        update-types: [version-update:semver-major]
      # croner 4 breaks shep-core's cron parsing; the ceiling in the root
      # Cargo.toml is deliberate. Drop this once config/cron.rs moves to croner 4.
      - dependency-name: croner
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    cooldown:
      default-days: 7
    # `@astrojs/check` peers on `typescript@^5 || ^6`, so a major bump here
    # makes `npm ci` fail to resolve and takes the Pages deploy with it.
    # Drop this once that peer range covers 7.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
