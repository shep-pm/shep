name: Dog release
# A dog repository calls this on release. It builds the dog's bare binary for
# every target shep itself ships for, uploads each to the dog's own release
# as `<package>-<version>-<target>` (plus `.exe` on Windows, no archive), and
# opens a pull request on shep-pm/shep that sets the index row's `version`,
# per-target sha256 and `permissions`. The permissions are read off the built
# Linux binary's own `--shep-manifest` answer, in the read-only job. A person
# merging that pull request is the review the index stands for; nothing here
# approves a version by itself.
#
# The index branch is one per dog, `dog-release/<package>`, not one per
# version: three releases in a day used to open three pull requests at once,
# and merging an older one after a newer one would set the row back. A run for
# a newer version edits the open pull request to name it instead of opening a
# second one, and a run for an older one writes nothing at all.
#
# The asset name and the tag are not free: `shep install` builds
# `<repo>/releases/download/v<version>/<package>-<version>-<target>` from the
# index row, so the tag has to be `v<version>`. See the "Releasing a dog"
# section of web/src/pages/docs/writing-a-dog.astro for the calling job.
# The calling job grants `contents: write` and `actions: read` and pins this
# workflow by commit. Before replacing a release's assets it closes the open
# index pull request for that same version, so a run that fails part-way never
# leaves one holding hashes the release no longer serves.
#
# A dog that cannot build for a target names it in `skip-targets`. Its row then
# hashes the rest, and `shep install` builds from source on the skipped target.
#
# Run by hand with `workflow_dispatch` it is a dry run against any public
# dog repository: it builds every target and prints the hashes, and uploads
# and opens nothing.
on:
  workflow_call:
    inputs:
      package:
        description: The cargo package name, which is also the index row's `package`
        type: string
        required: true
      tag:
        description: The release tag to build, `v<version>`
        type: string
        required: true
      bin:
        description: The binary to ship, when it is not named after the package
        type: string
        default: ""
      repository:
        description: The repository to build, when it is not the calling one
        type: string
        default: ""
      skip-targets:
        description: Targets this dog cannot build for, space separated
        type: string
        default: ""
      dry-run:
        description: Build and print the hashes, but upload nothing and open nothing
        type: boolean
        default: false
    secrets:
      index-token:
        description: >-
          A GitHub App installation token or a PAT that can push a branch and
          open a pull request on shep-pm/shep. The default token cannot write
          to another repository. Not needed for a dry run.
        required: false
  workflow_dispatch:
    inputs:
      package:
        description: The cargo package name, e.g. shep-log-rotate
        required: true
      tag:
        description: An existing tag of the dog, e.g. v0.2.4
        required: true
      repository:
        description: The dog's repository, e.g. shep-pm/shep-log-rotate
        required: true
      bin:
        description: The binary to ship, when it is not named after the package
        default: ""
      skip-targets:
        description: Targets this dog cannot build for, space separated
        default: ""
      dry-run:
        description: Must stay on here; a real release is the dog repository's own call
        type: boolean
        default: true

permissions: {}

jobs:
  # Everything the later jobs would otherwise find out an hour into a build:
  # the tag is `v<version>`, it is the version Cargo.toml carries at that tag,
  # the binary exists, and the release already exists to take the assets.
  resolve:
    name: Resolve the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      bin: ${{ steps.check.outputs.bin }}
      repository: ${{ steps.check.outputs.repository }}
      # The commit the tag named when it was checked. Later jobs build this,
      # not the tag, which a force-push could move under a running release.
      sha: ${{ steps.check.outputs.sha }}
      dry-run: ${{ steps.check.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - id: check
        env:
          # Through the environment, not spliced into the script: these come
          # from another repository's workflow.
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ inputs.tag }}
          BIN: ${{ inputs.bin }}
          REPOSITORY: ${{ inputs.repository || github.repository }}
          DRY_RUN: ${{ inputs.dry-run }}
          SKIP_TARGETS: ${{ inputs.skip-targets }}
          INDEX_TOKEN: ${{ secrets.index-token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [[ "$PACKAGE" =~ ^[A-Za-z0-9_-]+$ ]] || fail "package '$PACKAGE' is not a cargo package name"
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || fail "repository '$REPOSITORY' is not owner/name"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]] \
            || fail "tag '$TAG' is not v<version>. The index builds its download URL from v<version>, so any other tag cannot be installed from."
          # The row's permissions are read off this leg's binary.
          case " $SKIP_TARGETS " in
            *" x86_64-unknown-linux-gnu "*) fail "skip-targets cannot name x86_64-unknown-linux-gnu: the index row's permissions are read off that binary." ;;
          esac
          version="${TAG#v}"
          bin="${BIN:-$PACKAGE}"
          dry_run=false
          if [ "$DRY_RUN" = true ]; then dry_run=true; fi

          # A dispatch runs in this repository's token, which cannot upload to
          # a dog's release. Refuse here rather than after the builds.
          if [ "$dry_run" = false ] && [ "$REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            fail "a real release runs from the dog's own repository, not from $GITHUB_REPOSITORY. Call this workflow from $REPOSITORY, or run a dry run."
          fi

          manifest="$(cargo metadata --no-deps --format-version 1)"
          found="$(jq -r --arg p "$PACKAGE" '[.packages[] | select(.name == $p) | .version][0] // empty' <<< "$manifest")"
          [ -n "$found" ] || fail "$REPOSITORY has no package named $PACKAGE at $TAG"
          [ "$found" = "$version" ] \
            || fail "$PACKAGE is $found in Cargo.toml at $TAG, so the tag would approve $version for a binary that says $found. Tag the commit that bumps the version."
          jq -e --arg p "$PACKAGE" --arg b "$bin" '
            [.packages[] | select(.name == $p) | .targets[]
              | select(.name == $b and (.kind | index("bin")))] | length > 0
          ' <<< "$manifest" > /dev/null \
            || fail "$PACKAGE has no binary named $bin. Pass 'bin' when it is not named after the package."

          # Before the builds, not after: without it the whole matrix would run
          # and upload, and only then find there is no way to open the pull
          # request.
          if [ "$dry_run" = false ] && [ -z "$INDEX_TOKEN" ]; then
            fail "the index-token secret is empty. Pass a token that can open a pull request on shep-pm/shep, or run with dry-run."
          fi

          if [ "$dry_run" = false ]; then
            gh release view "$TAG" --repo "$REPOSITORY" > /dev/null \
              || fail "$REPOSITORY has no release for $TAG yet. Create the release first; the binaries are attached to it."
          fi

          {
            echo "version=${version}"
          echo "sha=$(git rev-parse HEAD)"
            echo "bin=${bin}"
            echo "repository=${REPOSITORY}"
            echo "dry-run=${dry_run}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        # The targets, hosts and packages of `upload` in release-artifacts.yml,
        # copied: GitHub gives a matrix no way to cross from one workflow file
        # into another. scripts/test_dog_release_targets.py fails when the two
        # lists differ, so adding a target there fails until it is added here.
        # `build_tool` is left out: that is an input of the action
        # release-artifacts.yml builds with, and this job calls cargo itself.
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            packages: musl-tools
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    # Read only. This job runs the dog's build scripts, and a build script
    # can prepend to GITHUB_PATH and swap any tool a later step runs, so
    # nothing here holds a token that can write. The `upload` job below does
    # that, from the built files alone. It is also the only job that runs the
    # dog's binary, to read the manifest the index row lists.
    permissions:
      contents: read
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # A job-level `if` has no `matrix` context, so a skipped leg still starts
      # and every step below waits on this output.
      - id: leg
        env:
          SKIP_TARGETS: ${{ inputs.skip-targets }}
          TARGET: ${{ matrix.target }}
        run: |
          case " $SKIP_TARGETS " in
            *" $TARGET "*) echo "::notice::Skipping ${TARGET}: the dog lists it in skip-targets." ;;
            *) echo 'build=true' >> "$GITHUB_OUTPUT" ;;
          esac
      - if: steps.leg.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      # The target goes on whichever toolchain `cargo` will pick in this
      # checkout, so a dog's rust-toolchain.toml gets it too. Installing it on
      # `stable` alone would leave a pinned toolchain without the standard
      # library for the target.
      - if: steps.leg.outputs.build == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
      - if: steps.leg.outputs.build == 'true' && matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: Build
        if: steps.leg.outputs.build == 'true'
        env:
          PACKAGE: ${{ inputs.package }}
          BIN: ${{ needs.resolve.outputs.bin }}
          TARGET: ${{ matrix.target }}
        # `--locked`: the hash approved in the index is of a build from the
        # lockfile at the tag, not of whatever resolves on the day.
        run: cargo build --release --locked --package "$PACKAGE" --bin "$BIN" --target "$TARGET"
      - name: Stage the bare binary under its release name
        if: steps.leg.outputs.build == 'true'
        env:
          PACKAGE: ${{ inputs.package }}
          BIN: ${{ needs.resolve.outputs.bin }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          exe=''
          case "$TARGET" in *-windows-*) exe=.exe ;; esac
          asset="${PACKAGE}-${VERSION}-${TARGET}${exe}"
          mkdir dist
          # Where cargo wrote it, not an assumed `target/`: a dog's
          # `.cargo/config.toml` `build.target-dir` or a `CARGO_TARGET_DIR`
          # moves it, and `cargo metadata` reads both.
          target_dir="$(cargo metadata --no-deps --format-version 1 | jq -r .target_directory)"
          # Git for Windows' bash wants `/d/a/...`, not `D:\a\...`.
          if command -v cygpath > /dev/null; then target_dir="$(cygpath -u "$target_dir")"; fi
          cp "${target_dir}/${TARGET}/release/${BIN}${exe}" "dist/${asset}"
          # `sha256sum` where there is one (Linux, Git for Windows), else the
          # macOS spelling. Both print `<hash>  <name>`, the line
          # scripts/dog-index-update.py reads back.
          cd dist
          if command -v sha256sum > /dev/null; then sum=(sha256sum); else sum=(shasum -a 256); fi
          line="$("${sum[@]}" -- "$asset")"
          echo "$line"
          {
            echo '```'
            echo "$line"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The manifest is read off the built binary, and off one leg only: a dog
      # declares one manifest for every target, and this is the leg whose
      # binary the runner can exec. Reading it here, in the job whose token
      # cannot write, is what keeps the jobs that hold one from running a file
      # the dog built. A dog that answers nothing, or answers something that is
      # not a manifest, costs the index row its permissions and costs the
      # release nothing.
      - id: manifest
        name: Read the manifest the built binary prints
        if: steps.leg.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PACKAGE: ${{ inputs.package }}
          BIN: ${{ needs.resolve.outputs.bin }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          asset="dist/${PACKAGE}-${VERSION}-${TARGET}"
          reason=''
          # `timeout`, and not a bare run: a dog that ignores `--shep-manifest`
          # and starts its loop never returns, and an unbounded probe holds this
          # job to its 60-minute timeout, cancelling `upload` and `index-pr`
          # with it. A manifest that never arrives stays a missing manifest.
          # `-k 5` kills a dog that walks past SIGTERM.
          status=0
          timeout -k 5 60 "./$asset" --shep-manifest > candidate.json 2> stderr.txt || status=$?
          if [ "$status" -ne 0 ]; then
            if [ "$status" = 124 ]; then
              reason="${BIN} ran on past 60s after --shep-manifest and was killed: it looks like a dog that starts its loop instead of answering"
            else
              reason="${BIN} did not answer --shep-manifest (exit ${status})"
            fi
          # `-s` slurps every document the binary printed into one array, and
          # the length is what refuses more than one: `jq -e` alone reports the
          # last document only, so a binary printing two objects, the last with
          # a permissions array, would pass here and fail in `index-pr`, after
          # the release is already published. The four fields are what
          # manifest.rs says makes an answer a manifest at all. `permissions`
          # may be absent, because manifest.rs leaves the key out when the list
          # is empty: a dog that asks for nothing has a manifest, and its row
          # is written with the empty list that reads as "none".
          elif ! jq -es 'length == 1 and (.[0] | type == "object") and (["manifest", "name", "version", "protocol"] - (.[0] | keys) == []) and ((.[0] | has("permissions") | not) or (.[0].permissions | type == "array"))' candidate.json > /dev/null; then
            reason="${BIN} answered --shep-manifest with something other than one manifest"
          fi
          if [ -z "$reason" ]; then
            mv candidate.json manifest.json
            echo 'read=true' >> "$GITHUB_OUTPUT"
            echo "Read $(jq -r '.permissions | length' manifest.json) permissions from the manifest."
          else
            rm -f candidate.json
            echo "::notice::${reason}. The index row will list no permissions."
            {
              echo "No manifest for \`${BIN}\`: ${reason}."
              echo
              echo '```'
              head -c 2000 stderr.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Hand the binary to the upload job
        if: steps.leg.outputs.build == 'true' && needs.resolve.outputs.dry-run != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
      # Its own artifact, named beside `dist-*` and not inside it: the `upload`
      # job downloads `dist-*` and attaches everything it finds, and a manifest
      # on the release is a file `shep install` could be handed.
      - name: Hand the manifest to the index job
        if: steps.leg.outputs.build == 'true' && needs.resolve.outputs.dry-run != 'true' && steps.manifest.outputs.read == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-${{ matrix.target }}
          path: manifest.json
          if-no-files-found: error
          retention-days: 1

  # The only job that can write to the release, and it runs nothing from the
  # dog: it downloads what `build` made and attaches it. `gh` is the runner's
  # own, since no step of the dog's has run on this machine.
  #
  # `gh run download`, not `actions/download-artifact`, which this repository
  # pins by commit nowhere yet; it needs `actions: read`, which a caller
  # granting its own `permissions:` has to list beside `contents: write`.
  upload:
    name: Attach to the release
    needs: [resolve, build]
    if: needs.resolve.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15
    outputs:
      # The names this run uploaded, space separated. They are made of the
      # characters `resolve` allowed, so none holds a space.
      assets: ${{ steps.attach.outputs.assets }}
    steps:
      # An earlier run's index pull request holds the hashes of the assets
      # about to be replaced. If this run then fails part-way, that pull
      # request would still be open, merge-ready and wrong: the release would
      # serve new binaries under old hashes. Closing it first means a failed
      # run leaves none, and `index-pr` writes the branch again on success. A
      # run that fails before this point replaced nothing, so its pull request
      # stays valid.
      #
      # Only this version's pull request: the branch is one per dog, so an open
      # one may hold another version's row, and the assets that row hashed are
      # not the ones being replaced here.
      - name: Close the index pull request these assets would outdate
        env:
          GH_TOKEN: ${{ secrets.index-token }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          branch="dog-release/${PACKAGE}"
          title="chore(web): approve ${PACKAGE} ${VERSION} in the dog index"
          # `isCrossRepository` false: `--head` matches a branch name alone,
          # so a fork's pull request from a same-named branch would count.
          # Through `jq` rather than `--jq`: the title is a shell variable, and
          # `gh pr list` has no way to hand one to its filter.
          number="$(gh pr list --repo shep-pm/shep --head "$branch" --state open \
            --json number,title,isCrossRepository \
            | jq -r --arg title "$title" \
              '[.[] | select(.isCrossRepository == false and .title == $title)][0].number // empty')"
          if [ -n "$number" ]; then
            gh pr close "$number" --repo shep-pm/shep --delete-branch \
              --comment "A new run of ${PACKAGE} ${VERSION} is replacing the release assets this pull request hashed. The index branch is written again when the upload completes."
          fi
      - id: attach
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'dist-*'
          # `--clobber`: a re-run replaces the asset, and `index-pr` hashes
          # what the release holds, not what a leg built.
          gh release upload "$TAG" dist/*/* --clobber
          names="$(for f in dist/*/*; do basename "$f"; done | sort | tr '\n' ' ')"
          echo "assets=${names% }" >> "$GITHUB_OUTPUT"

  # Hashes what the release serves rather than what the legs built, since
  # that is the file `shep install` downloads and checks. Only the files this
  # run uploaded: a re-run with fewer targets must not carry an older run's
  # assets into the index.
  index-pr:
    name: Open the index pull request
    needs: [resolve, upload]
    if: needs.resolve.outputs.dry-run != 'true'
    # The branch is one per dog and every run force-pushes it, so two runs for
    # one dog must not be pushing at the same time. `cancel-in-progress: false`
    # so a run is never cut off between the push and the pull request it opens.
    concurrency:
      group: dog-index-${{ inputs.package }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # `actions: read` for the manifest artifact the Linux leg handed over. This
    # job runs nothing the dog built: it reads the file the leg kept.
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    env:
      INDEX_TOKEN: ${{ secrets.index-token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shep-pm/shep
          ref: main
          path: shep
          persist-credentials: false
      - name: Hash the release's assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ inputs.tag }}
          ASSETS: ${{ needs.upload.outputs.assets }}
        run: |
          set -euo pipefail
          read -ra names <<< "$ASSETS"
          [ "${#names[@]}" -gt 0 ] || { echo "::error::the upload job named no assets"; exit 1; }
          mkdir assets
          args=()
          for name in "${names[@]}"; do args+=(--pattern "$name"); done
          gh release download "$TAG" --dir assets "${args[@]}"
          : > sums.txt
          for name in "${names[@]}"; do
            test -f "assets/$name" || { echo "::error::$name is not on the release"; exit 1; }
            (cd assets && sha256sum -- "$name") >> sums.txt
          done
          cat sums.txt
      # The manifest the Linux leg read, if it read one. `gh run download`
      # rather than `actions/download-artifact`, which this repository pins by
      # commit nowhere yet.
      - id: manifest
        name: Fetch the manifest the Linux leg handed over
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact='manifest-x86_64-unknown-linux-gnu'
          # `build` uploads the manifest only when the leg read one, so the
          # run's own artifact list is what tells "the dog answered nothing"
          # from "the download broke": `gh run download` fails the same way
          # either way. Reading a broken download as no manifest would drop the
          # row's permissions and blame the dog for it, after the release is
          # already out.
          names="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[].name')"
          if ! grep -q -x "$artifact" <<< "$names"; then
            echo "The Linux leg handed over no manifest, so the row will list no permissions."
            exit 0
          fi
          if ! gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --dir manifests --pattern "$artifact"; then
            echo "::error::this run has ${artifact} and it would not download. The index row is not written."
            exit 1
          fi
          if ! test -f "manifests/${artifact}/manifest.json"; then
            echo "::error::${artifact} downloaded with no manifest.json inside it. The index row is not written."
            exit 1
          fi
          echo "manifest=manifests/${artifact}/manifest.json" >> "$GITHUB_OUTPUT"
      # The branch is this dog's own, and holds the row an open pull request
      # would merge. Reading it is what tells "this is the newest release" from
      # "a newer one is approved, or pending", which the script refuses.
      - id: pending
        name: Read the row an open pull request would merge
        env:
          GH_TOKEN: ${{ secrets.index-token }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          branch="dog-release/${PACKAGE}"
          # A branch that does not exist answers 404, and so does a token that
          # cannot see this repository. Only the first reads as "nothing is
          # pending": reading the second that way would write a row over a
          # newer one this run cannot see.
          if ! content="$(gh api "repos/shep-pm/shep/contents/web/public/dogs.json" \
            --field ref="$branch" --jq .content 2>&1)"; then
            case "$content" in
              *"Not Found"*)
                echo "No ${branch} branch, so nothing is pending for ${PACKAGE}."
                exit 0
                ;;
              *)
                echo "::error::could not read the row on ${branch}: ${content}"
                exit 1
                ;;
            esac
          fi
          printf '%s' "$content" | tr -d '\n' | base64 -d > pending.json
          version="$(jq -r --arg package "$PACKAGE" \
            '[.dogs[] | select(.package == $package)][0].source.version // empty' pending.json)"
          [ -n "$version" ] || { echo "::error::${branch} holds no row for ${PACKAGE}"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - id: write
        name: Write the row
        env:
          PACKAGE: ${{ inputs.package }}
          REPOSITORY: ${{ needs.resolve.outputs.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
          PENDING: ${{ steps.pending.outputs.version }}
        run: |
          set -euo pipefail
          args=(shep/web/public/dogs.json "$PACKAGE" "$VERSION" sums.txt "$REPOSITORY")
          # The manifest is the sixth argument, and only when a leg read one.
          if [ -n "$MANIFEST" ]; then args+=("$MANIFEST"); fi
          if [ -n "$PENDING" ]; then args+=(--pending "$PENDING"); fi
          rc=0
          python3 shep/scripts/dog-index-update.py "${args[@]}" || rc=$?
          case "$rc" in
            0) echo "wrote=true" >> "$GITHUB_OUTPUT" ;;
            # Exit 3 is "a newer version is already approved or pending". This
            # run is the older one and the index is right as it stands, so say
            # so and end green: nothing is pushed and nothing is opened, and
            # the pull request holding the newer version stays as it is.
            3) echo "A newer version of ${PACKAGE} is already approved or pending, so this run wrote nothing." >> "$GITHUB_STEP_SUMMARY" ;;
            *) exit "$rc" ;;
          esac
      - name: Open the pull request
        if: steps.write.outputs.wrote == 'true'
        env:
          GH_TOKEN: ${{ secrets.index-token }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REPOSITORY: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ inputs.tag }}
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
        run: |
          set -euo pipefail
          cd shep
          branch="dog-release/${PACKAGE}"
          title="chore(web): approve ${PACKAGE} ${VERSION} in the dog index"
          # Only a pull request from a branch of this repository: `--head`
          # alone also matches a fork's same-named branch.
          open_pr() {
            gh pr list --repo shep-pm/shep --head "$branch" --state open \
              --json number,isCrossRepository \
              --jq '[.[] | select(.isCrossRepository == false)][0].number // empty'
          }
          if git diff --quiet -- web/public/dogs.json; then
            echo "The index already approves ${PACKAGE} ${VERSION} with these hashes. Nothing to open."
            # An earlier run's pull request would now change nothing, or
            # worse, carry other hashes. Close it rather than leave it to merge.
            number="$(open_pr)"
            if [ -n "$number" ]; then
              gh pr close "$number" --repo shep-pm/shep --delete-branch \
                --comment "main already approves ${PACKAGE} ${VERSION} with the hashes of the latest run, so this pull request has nothing to change."
            fi
            exit 0
          fi
          {
            echo "Approves \`${PACKAGE}\` ${VERSION} and its prebuilt binaries in the dog index."
            echo
            echo "- Release: https://github.com/${REPOSITORY}/releases/tag/${TAG}"
            echo "- Built by: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Changes only this row's \`version\`, \`sha256\` and \`permissions\`"
            if [ -n "$MANIFEST" ]; then
              echo "- Permissions read from the built \`x86_64-unknown-linux-gnu\` binary"
            else
              echo "- No manifest from the built binaries, so the row lists no permissions"
            fi
            echo
            echo "Merging this is the review: \`shep install ${PACKAGE}\` will install this version and no other."
          } > body.md
          git checkout -b "$branch"
          git add web/public/dogs.json
          git -c user.name='shep dog release' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "$title"
          git remote set-url origin "https://x-access-token:${INDEX_TOKEN}@github.com/shep-pm/shep.git"
          # Forced: the branch is this workflow's own, and a re-run should
          # replace its hashes rather than stop on the old ones.
          git push --force origin "HEAD:refs/heads/${branch}"

          number="$(open_pr)"
          if [ -n "$number" ]; then
            # One branch per dog, so this pull request is the dog's, and the
            # branch under it now carries this version's row. Set its title and
            # body to this version's as well: a reviewer merges what the pull
            # request says it merges, and leaving them naming an older version
            # would merge that one's row under this version's name.
            gh pr edit "$number" --repo shep-pm/shep --title "$title" --body-file body.md
            exit 0
          fi
          gh pr create --repo shep-pm/shep --base main --head "$branch" \
            --title "$title" --body-file body.md
