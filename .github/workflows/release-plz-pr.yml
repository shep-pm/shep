name: Release PR
# Maintains the pull request that bumps the version and writes the changelog.
# Merging it is a hand decision: several changes to main stack into one
# release that way, rather than every merge cutting its own.
#
# Squash that merge, never a merge commit. release-plz substitutes a merge
# commit for its pull request's head before packaging, so `cargo publish`
# would ship a tree that never landed on main. A squash leaves nothing for
# that lookup to find. docs/releasing.md carries the full reasoning.

permissions:
  contents: write
  pull-requests: write
  # The breaking-bump guard writes its verdict as a commit status on the
  # release pull request's head. This workflow runs on a push to main rather
  # than on the pull request, so a failing step here is a red run in the
  # Actions tab and nothing at all on the pull request itself. Measured
  # 2026-09-21: the guard failed on `aee84c99` while #531 read
  # `MERGEABLE / CLEAN` with 31 green checks and no way to see the refusal.
  statuses: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plz-pr
  cancel-in-progress: false

jobs:
  release-plz-pr:
    name: Update release PR
    runs-on: ubuntu-latest
    # Skips the release PR's own merge landing on main. A human merging it
    # pushes as themselves, which (unlike GITHUB_TOKEN) retriggers this
    # workflow, so without this guard the merge would open a new release PR
    # in a cycle.
    #
    # Matches both shapes the merge can take: a squash ("chore: release") and
    # a merge commit ("Merge pull request #N from .../release-plz-...").
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: release') &&
      !contains(github.event.head_commit.message, '/release-plz-')
    # A ceiling against a hang, not a budget: runs take well under two
    # minutes. Matters more here than in most jobs, since this one holds a
    # write-capable token against GitHub's 360-minute default.
    timeout-minutes: 30
    steps:
      # Every action here is pinned by commit, not by tag: this job holds
      # RELEASE_PLZ_TOKEN and CARGO_REGISTRY_TOKEN, a bigger risk for a
      # mutable tag than in a job that only runs tests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-plz reads the commits since the last release tag, so a
          # shallow clone would give it nothing to write a changelog from.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # Write-capable token: without this it lands in .git/config,
          # readable by every later step. release-plz pushes over the API.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Pinning by SHA replaces the ref this action reads its default
          # toolchain from, so it fails without an explicit `toolchain:` here.
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Pinned by commit: this action holds contents:write and
      # pull-requests:write, so a mutable tag means trusting whatever it
      # later points at.
      - uses: release-plz/action@8e61445f0b34e7c6d985255f2f1f05a36eb350dc # v0.5.137
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # Read-only here: `release-pr` does not upload, but release-plz uses
          # the registry to work out which versions are already published.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Fails the run rather than closing the PR: a changelog-only release
      # PR also happens legitimately, when a hand-edited version leaves
      # release-plz nothing to bump. Left open and red, a human decides
      # which case it is before merging.
      - name: Guard the release PR's version and changelog
        id: noop-guard
        if: ${{ steps.release-plz.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PR_NUMBER: ${{ fromJSON(steps.release-plz.outputs.pr).number }}
        run: |
          set -euo pipefail

          # Compares the version VALUE, not path presence: release-plz also
          # rewrites intra-workspace dependency versions in Cargo.toml, so a
          # diff touching the file does not mean the package version changed.
          manifest_version() {
            gh api "repos/${GITHUB_REPOSITORY}/contents/Cargo.toml?ref=$1" \
              -H 'Accept: application/vnd.github.raw' \
              | grep -E '^[[:space:]]*version[[:space:]]*=' | tr -d '[:space:]'
          }
          base_sha="$(gh pr view "$PR_NUMBER" --json baseRefOid --jq .baseRefOid)"
          head_sha="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          base_version="$(manifest_version "$base_sha")" || base_version=""
          head_version="$(manifest_version "$head_sha")" || head_version=""
          # Fails closed on a fetch error: an empty string from one side would
          # read as a version bump. Both empty is already safe since they'd
          # compare equal.
          if [ -z "$base_version" ] || [ -z "$head_version" ]; then
            echo "::error::could not read Cargo.toml at $base_sha or at $head_sha, so a version change cannot be confirmed."
            echo "::error::Refusing rather than guessing. Re-run the job."
            exit 1
          fi
          if [ "$base_version" = "$head_version" ]; then
            echo "::error::release PR #$PR_NUMBER changes no version in Cargo.toml."
            echo "::error::That is the no-op shape that looped on zendriver-rs on 2026-08-08, and also"
            echo "::error::what a hand-edited version leaves behind. Left open for a human: merge it if"
            echo "::error::the changelog entry is wanted, close it if this is a loop."
            exit 1
          fi

          # A bump can also be real and still be too small. release-plz walks
          # each package's history one commit at a time, asking the commit it
          # is standing on for its own next ancestor, so on a diamond (two
          # branches cut from one base, merged in turn) it goes down one leg
          # and never crosses to the other. Measured 2026-09-20 against
          # release-plz 0.3.160: it lost `refactor(daemon)!: carry the real
          # error in BootError::Adopt` that way and proposed 0.8.5 for a break
          # that needed 0.9.0. cargo-semver-checks passed, having no lint for
          # a changed variant payload under `#[non_exhaustive]`, so nothing
          # else would have caught it either. The same commits rebased
          # into a line produced 0.9.0 correctly.
          #
          # The script reads git and two manifests, so it wants the tags and
          # the full history that `fetch-depth: 0` above fetches, and no
          # toolchain. `manifest_version` returns the line with its spaces
          # gone, so the quotes come off here.
          head_number="$(printf '%s' "${head_version#version=}" | tr -d '"')"
          bump_state=success
          if ! python3 scripts/check-breaking-bump.py \
              --base-sha "$base_sha" \
              --base-version "$(printf '%s' "${base_version#version=}" | tr -d '"')" \
              --head-version "$head_number"; then
            bump_state=failure
          fi

          # Written on both outcomes, and written before the exit below. A
          # status only ever attaches to the sha it names, so a force-push
          # leaves the new head with none, which reads as unverified rather
          # than as inherited approval. Add `release bump` to main's ruleset
          # to make this block the merge as well as report it.
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
            -f state="$bump_state" \
            -f context='release bump' \
            -f description="$head_number against the breaking commits since the last release" \
            --silent

          if [ "$bump_state" = failure ]; then
            echo "::error::release PR #$PR_NUMBER publishes a breaking change as a compatible release."
            echo "::error::Left open for a human: set the version by hand on the release branch, or"
            echo "::error::rebase the pull request that carried the break into one line of history."
            exit 1
          fi

          # The other no-op shape: release-plz can bump the version even when
          # every commit since the last release was filtered out by
          # release-plz-changelog.toml, producing a version header with
          # nothing under it. The version-value guard above passes this
          # correctly, since the bump is real; this guard catches the empty
          # changelog instead.
          #
          # Scoped to the new version's own added lines: `gh pr diff` prints
          # every file in the PR, so a bullet added anywhere else would
          # otherwise pass a guard whose only question is the new section's
          # content.
          #
          # Leading whitespace is tolerated in the pattern even though the
          # template's `trim = true` strips it per line: dropping `trim`
          # later would otherwise stop every release here with no clear
          # signal why.
          if ! gh pr diff "$PR_NUMBER" | awk '
                /^diff --git /                 { in_log = 0 }
                /^\+\+\+ b\/.*CHANGELOG\.md$/  { in_log = 1; under_new = 0; next }
                !in_log                        { next }
                /^\+## \[/                     { under_new = 1; next }
                under_new && /^\+[[:space:]]*[-*][[:space:]]/ { found = 1 }
                END                            { exit !found }
              '; then
            echo "::error::release PR #$PR_NUMBER bumps a version but its new changelog section is empty."
            echo "::error::Every commit since the last release was filtered out by release-plz-changelog.toml."
            echo "::error::Left open for a human: close it, or land something worth releasing first."
            exit 1
          fi
