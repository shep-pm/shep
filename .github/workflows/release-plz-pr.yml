name: Release PR
# Maintains the pull request that bumps the version and writes the changelog.
# Merging it is a hand decision: several changes to main stack into one
# release that way, rather than every merge cutting its own.
#
# Squash that merge, never a merge commit. release-plz substitutes a merge
# commit for its pull request's head before packaging, so `cargo publish`
# would ship a tree that never landed on main. A squash leaves nothing for
# that lookup to find. docs/releasing.md carries the full reasoning.

permissions:
  contents: write
  pull-requests: write
  # The release guard writes its verdict as a commit status on the
  # release pull request's head. This workflow runs on a push to main rather
  # than on the pull request, so a failing step here is a red run in the
  # Actions tab and nothing at all on the pull request itself. Measured
  # 2026-09-21: the guard failed on `aee84c99` while #531 read
  # `MERGEABLE / CLEAN` with 31 green checks and no way to see the refusal.
  statuses: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plz-pr
  cancel-in-progress: false

jobs:
  release-plz-pr:
    name: Update release PR
    runs-on: ubuntu-latest
    # Skips the release PR's own merge landing on main. A human merging it
    # pushes as themselves, which (unlike GITHUB_TOKEN) retriggers this
    # workflow, so without this guard the merge would open a new release PR
    # in a cycle.
    #
    # Matches both shapes the merge can take: a squash ("chore: release") and
    # a merge commit ("Merge pull request #N from .../release-plz-...").
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: release') &&
      !contains(github.event.head_commit.message, '/release-plz-')
    # A ceiling against a hang, not a budget: runs take well under two
    # minutes. Matters more here than in most jobs, since this one holds a
    # write-capable token against GitHub's 360-minute default.
    timeout-minutes: 30
    steps:
      # Every action here is pinned by commit, not by tag: this job holds
      # RELEASE_PLZ_TOKEN and CARGO_REGISTRY_TOKEN, a bigger risk for a
      # mutable tag than in a job that only runs tests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-plz reads the commits since the last release tag, so a
          # shallow clone would give it nothing to write a changelog from.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # Write-capable token: without this it lands in .git/config,
          # readable by every later step. release-plz pushes over the API.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Pinning by SHA replaces the ref this action reads its default
          # toolchain from, so it fails without an explicit `toolchain:` here.
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Pinned by commit: this action holds contents:write and
      # pull-requests:write, so a mutable tag means trusting whatever it
      # later points at.
      - uses: release-plz/action@6caa8d34f74d82b0dc76a18edd1cc3d6801c9baf # v0.5.143
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # Read-only here: `release-pr` does not upload, but release-plz uses
          # the registry to work out which versions are already published.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Three checks on the branch release-plz just pushed. Two of them fail
      # for a human to read. The middle one does not: release-plz's own walk
      # under-reads a diamond, so scripts/fix-release-bump.py writes what it
      # missed onto the release branch and pushes it, and a release PR that
      # came out too small comes back correct instead of red. It fails only
      # when it cannot read the branch, or cannot move the version it is being
      # asked to report. It writes to the release branch only, so nothing
      # publishes: a release still waits for a human to merge.
      - name: Guard the release PR's version and changelog
        id: guard
        if: ${{ steps.release-plz.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PR_NUMBER: ${{ fromJSON(steps.release-plz.outputs.pr).number }}
        run: |
          set -euo pipefail

          # Compares the version VALUE, not path presence: release-plz also
          # rewrites intra-workspace dependency versions in Cargo.toml, so a
          # diff touching the file does not mean the package version changed.
          manifest_version() {
            gh api "repos/${GITHUB_REPOSITORY}/contents/Cargo.toml?ref=$1" \
              -H 'Accept: application/vnd.github.raw' \
              | grep -E '^[[:space:]]*version[[:space:]]*=' | tr -d '[:space:]'
          }
          base_sha="$(gh pr view "$PR_NUMBER" --json baseRefOid --jq .baseRefOid)"
          head_sha="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          base_version="$(manifest_version "$base_sha")" || base_version=""
          head_version="$(manifest_version "$head_sha")" || head_version=""
          # Fails closed on a fetch error: an empty string from one side would
          # read as a version bump. Both empty is already safe since they'd
          # compare equal.
          if [ -z "$base_version" ] || [ -z "$head_version" ]; then
            echo "::error::could not read Cargo.toml at $base_sha or at $head_sha, so a version change cannot be confirmed."
            echo "::error::Refusing rather than guessing. Re-run the job."
            exit 1
          fi
          if [ "$base_version" = "$head_version" ]; then
            echo "::error::release PR #$PR_NUMBER changes no version in Cargo.toml."
            echo "::error::That is the no-op shape that looped on zendriver-rs on 2026-08-08, and also"
            echo "::error::what a hand-edited version leaves behind. Left open for a human: merge it if"
            echo "::error::the changelog entry is wanted, close it if this is a loop."
            exit 1
          fi

          # A bump can also be real and still be too small, and a changelog can
          # be complete-looking and still be short. release-plz walks each
          # package's history one commit at a time, asking the commit it is
          # standing on for its own next ancestor, so on a diamond (two
          # branches cut from one base, merged in turn) it goes down one leg
          # and never crosses to the other. Measured 2026-09-20 against
          # release-plz 0.3.160: it lost `refactor(daemon)!: carry the real
          # error in BootError::Adopt` that way and proposed 0.8.5 for a break
          # that needed 0.9.0. cargo-semver-checks passed, having no lint for
          # a changed variant payload under `#[non_exhaustive]`, so nothing
          # else would have caught it either. The same commits rebased
          # into a line produced 0.9.0 correctly. Measured again 2026-10-13:
          # release PR #809 came out at 0.13.1 with none of #807, #803 or
          # #812 in its changelogs.
          #
          # The script reads git and the manifests, so it wants the tags and
          # the full history that `fetch-depth: 0` above fetches, and no
          # toolchain.
          pr_branch="$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)"

          # The script pushes over https with the token every other step here
          # already holds. checkout ran with persist-credentials: false, so the
          # remote carries no credential at all: the token goes on for the
          # push and the trap puts the plain URL back before any later step can
          # read .git/config. The token needs Contents: write for the push to
          # be accepted, which is what release-plz already needs to push the
          # branch in the first place.
          origin_url="$(git remote get-url origin)"
          git remote set-url origin "https://x-access-token:${RELEASE_PLZ_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          trap 'git remote set-url origin "$origin_url"' EXIT

          guard=judged
          if ! python3 scripts/fix-release-bump.py \
              --base-sha "$base_sha" \
              --head-sha "$head_sha" \
              --branch "$pr_branch" \
              --output "$GITHUB_OUTPUT"; then
            guard=refused
          fi

          # The script reports its verdict as key=value lines in $GITHUB_OUTPUT
          # because that is the one channel a step has to the rest of the job.
          read_out() {
            sed -n "s/^$1=//p" "$GITHUB_OUTPUT" | tail -n 1
          }
          new_version="$(read_out new_version)"
          old_version="$(read_out old_version)"
          new_head="$(read_out release_head)"
          changed="$(read_out changed)"
          new_head="${new_head:-$head_sha}"
          # `manifest_version` returns the line with its spaces gone, so the
          # quotes come off here. These three only matter if the script
          # succeeded without reporting, which is a broken script rather than a
          # broken release, and the fallbacks keep the status text honest.
          head_number="$(printf '%s' "${head_version#version=}" | tr -d '"')"
          new_version="${new_version:-$head_number}"
          old_version="${old_version:-$head_number}"

          if [ "$guard" = refused ]; then
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
              -f state=failure \
              -f context='release bump' \
              -f description='the guard could not read this release branch' \
              --silent
            echo "::error::release PR #$PR_NUMBER could not be judged."
            echo "::error::Left open for a human: the script refuses rather than rewrite a"
            echo "::error::branch it cannot read the range of commits behind, or write a version"
            echo "::error::its manifests, dependency literals and lockfile do not carry."
            exit 1
          fi

          if [ "$changed" = true ]; then
            # Keep whatever shape release-plz gave the title and move only the
            # number in it. The title is also what a squashed merge writes into
            # main's history, and the job's own `if` above reads that history
            # for the string `chore: release` to skip a release's own merge.
            # Nothing here waits on GitHub noticing the push: the title edit
            # names the pull request, and the diff below is read out of this
            # step's own git objects.
            if [ "$old_version" != "$new_version" ]; then
              title="$(gh pr view "$PR_NUMBER" --json title --jq .title)"
              if printf '%s' "$title" | grep -qF "$old_version"; then
                title="${title//"$old_version"/$new_version}"
              else
                title="chore: release v$new_version"
              fi
              gh pr edit "$PR_NUMBER" --title "$title"
            fi
            echo "Rewrote $pr_branch at $new_head: $old_version -> $new_version."
          fi

          # The other no-op shape: release-plz can bump the version even when
          # every commit since the last release was filtered out by
          # release-plz-changelog.toml, producing a version header with
          # nothing under it. The version-value guard above passes this
          # correctly, since the bump is real; this guard catches the empty
          # changelog instead. It runs against the head the guard left the
          # branch at, which is the head a merge would publish.
          #
          # The diff is built here rather than asked of GitHub. The guard's own
          # commit was created in this checkout, so both ends of the range are
          # local, while `gh pr diff` answers from GitHub's view of a head it
          # has not necessarily noticed yet: a step that pushed a moment ago can
          # be handed the diff from before its own push, and a guard reading a
          # stale diff is a guard that passed a branch it never looked at.
          #
          # `git diff` exits 0 whether or not it found a difference, so a
          # non-zero status here is git saying it could not do the diff at all.
          # The status is captured rather than left to the pipeline so that an
          # empty diff and a failed one cannot read the same.
          #
          # Scoped to the new version's own added lines: the diff prints every
          # changelog in the release, so a bullet added anywhere else would
          # otherwise pass a guard whose only question is the new section's
          # content.
          #
          # Leading whitespace is tolerated in the pattern even though the
          # template's `trim = true` strips it per line: dropping `trim`
          # later would otherwise stop every release here with no clear
          # signal why.
          changelog_diff="$RUNNER_TEMP/release-changelog.diff"
          diff_status=0
          git diff --no-color "$base_sha" "$new_head" -- '*CHANGELOG.md' > "$changelog_diff" || diff_status=$?
          if [ "$diff_status" -gt 1 ]; then
            echo "::error::git could not diff $base_sha against $new_head (exit $diff_status)."
            echo "::error::Refusing rather than judging a changelog this step cannot read. Re-run the job."
            exit 1
          fi

          bump_state=success
          bump_note="$new_version against every commit since the last release"
          if ! awk '
                /^diff --git /                 { in_log = 0 }
                /^\+\+\+ b\/.*CHANGELOG\.md$/  { in_log = 1; under_new = 0; next }
                !in_log                        { next }
                /^\+## \[/                     { under_new = 1; next }
                under_new && /^\+[[:space:]]*[-*][[:space:]]/ { found = 1 }
                END                            { exit !found }
              ' "$changelog_diff"; then
            bump_state=failure
            bump_note="$new_version, but its new changelog section is empty"
          fi

          # Written on both outcomes, and written before the exit below. A
          # status only ever attaches to the sha it names, so a force-push
          # leaves the new head with none, which reads as unverified rather
          # than as inherited approval. Add `release bump` to main's ruleset
          # to make this block the merge as well as report it.
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${new_head}" \
            -f state="$bump_state" \
            -f context='release bump' \
            -f description="$bump_note" \
            --silent

          if [ "$bump_state" = failure ]; then
            echo "::error::release PR #$PR_NUMBER bumps a version but its new changelog section is empty."
            echo "::error::Every commit since the last release was filtered out by release-plz-changelog.toml."
            echo "::error::Left open for a human: close it, or land something worth releasing first."
            exit 1
          fi
